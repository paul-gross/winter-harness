name = "winter-context"
prefix = "wx"

# Markdown-convention lint checks contributed to `winter lint` (see
# agent-context/linting.md). The field takes a list, so each check ships as its
# own script and runs over the selected scope, emitting NDJSON findings. The
# first three check what a reference means; the fourth runs the mechanical
# dprint/rumdl style gates over every scoped repo that has opted in by
# committing their configs.
lint = [
    "agent-context/scripts/lint_path_notation.py",
    "agent-context/scripts/lint_doc_references.py",
    "agent-context/scripts/lint_link_anchors.py",
    "agent-context/scripts/lint_markdown_style.py",
]

# winter-context is the governance layer beneath every other module: it documents
# conventions for all of them, so its docs may reference any module directly, and
# those references are dead pointers unless the module is installed alongside. We
# therefore require *every* module in the workspace (all but winter-context itself).
# Nothing requires winter-context back — declaring the full set keeps it strictly
# below everything, so any reference *to* winter-context would form a detectable cycle.
#
# winter-docs is the one carve-out: it consumes this repo, citing `winter-context:`
# paths for the conventions it narrates, so requiring it back would close a cycle.
# Nothing here cites a `winter-docs:` path — the lone `winter-docs:build` in
# verification/winter.md is a verifiability-matrix method id, not a path reference —
# so there is no dead pointer to guard against.
requires = [
    "winter",
    "winter-canon",
    "winter-github",
    "winter-nvim",
    "winter-plugin-api",
    "winter-product",
    "winter-service-docker",
    "winter-service-tmux",
    "winter-test-service",
    "winter-workflow",
]
