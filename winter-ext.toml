name = "winter-harness"
prefix = "wh"

# Markdown-convention lint checks contributed to `winter lint` (see
# agent-context/linting.md). The field takes a list, so each check ships as its
# own script and runs over the selected scope, emitting NDJSON findings.
lint = [
    "agent-context/scripts/lint_path_notation.py",
    "agent-context/scripts/lint_doc_references.py",
    "agent-context/scripts/lint_link_anchors.py",
]

# winter-harness is the governance layer beneath every other module: it documents
# conventions for all of them, so its docs may reference any module directly, and
# those references are dead pointers unless the module is installed alongside. We
# therefore require *every* module in the workspace (all but winter-harness itself).
# Nothing requires winter-harness back — declaring the full set keeps it strictly
# below everything, so any reference *to* winter-harness would form a detectable cycle.
requires = [
    "winter",
    "winter-docs",
    "winter-github",
    "winter-nvim",
    "winter-plugin-api",
    "winter-product",
    "winter-service-docker",
    "winter-service-tmux",
    "winter-test-service",
    "winter-workflow",
]
